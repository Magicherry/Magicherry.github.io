<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      Sampled from the composited backdrop at the viewport edge, not from
      --bg-base. The base token is the near-black *under* the field and is never
      what any edge of the page actually looks like; handing it to the browser
      paints the toolbars darker than the page they border, which is the black
      band phones show above and below the content.

      A static value now. It used to be rewritten by the theme provider on every
      switch, and there is one appearance left to describe.
    -->
    <meta name="theme-color" content="#0a111b" />

    <title>Daniel Zhou | Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Daniel Zhou (Magicherry) — AI Agent Engineer at NIO, building enterprise agent systems and obsessively detailed interfaces."
    />
    <meta name="author" content="Daniel Zhou" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Daniel Zhou | Portfolio" />
    <meta
      property="og:description"
      content="Enterprise AI agents by day, interface details by night. Selected work, experience and contact."
    />
    <meta property="og:url" content="https://Magicherry.github.io/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin />

    <!--
      A render-blocking script used to sit here to resolve the theme before first
      paint - React cannot do that, and the frame it would otherwise paint is a
      full-screen flash of the wrong one. With a single appearance there is
      nothing left to resolve: the stylesheet is the answer, and it arrives
      before first paint by definition.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
