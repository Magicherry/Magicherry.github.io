<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      Sampled from the composited backdrop at the viewport edge (v2's value),
      and the same as --bg-edge, the root canvas colour. Not --bg-page: since
      v3 took over v2's aurora field, the near-black page colour is never what
      any edge of the page looks like, and on iPhone Safari it painted solid
      black bands behind the status bar and the bottom toolbar.
    -->
    <meta name="theme-color" content="#0a111b" />
    <!--
      The appearance, settled before the first paint. React's ThemeProvider
      (src/lib/theme.tsx) owns it from mount on; this only stops a light-mode
      visitor seeing one dark frame first. Same rules: follow the system unless
      a stored manual choice is still within its expiry. The storage read is
      guarded because Safari Lockdown can throw; the system value still applies.
    -->
    <script>
      (function () {
        var theme = 'dark'
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
          theme = 'light'
        try {
          var o = JSON.parse(localStorage.getItem('v3:theme') || 'null')
          if (o && (o.value === 'light' || o.value === 'dark') && (o.expiresAt === null || (typeof o.expiresAt === 'number' && o.expiresAt > Date.now())))
            theme = o.value
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
        if (theme === 'light')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#eaf0f7')
      })()
    </script>

    <title>Daniel Zhou | Portfolio</title>

    -->
