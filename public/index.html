  <!-- Match App.js theme init before paint to avoid navbar / preloader color flash -->
  <script>
    (function () {
      try {
        var storedPreference = localStorage.getItem("themePreference");
        var storedTheme = null;

        if (storedPreference) {
          var parsedPreference = JSON.parse(storedPreference);
          if (
            parsedPreference &&
            (parsedPreference.value === "light" || parsedPreference.value === "dark") &&
            typeof parsedPreference.expiresAt === "number" &&
            Date.now() < parsedPreference.expiresAt
          ) {
            storedTheme = parsedPreference.value;
          } else {
            localStorage.removeItem("themePreference");
          }
        }

        if (!storedTheme) {
          var legacyTheme = localStorage.getItem("theme");
          if (legacyTheme === "light" || legacyTheme === "dark") {
            storedTheme = legacyTheme;
          }
        }

        if (storedTheme) {
          document.documentElement.setAttribute("data-theme", storedTheme);
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
          document.documentElement.setAttribute("data-theme", "light");
        } else {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
