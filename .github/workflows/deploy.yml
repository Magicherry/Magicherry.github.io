name: Deploy to Pages

on:
  push:
    branches: [main]
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# The site lives in v3/. v2/ and v1/ stay in the repo as archives and are never built.
defaults:
  run:
    working-directory: v3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Vite 8 requires ^20.19 || >=22.12.
          node-version: 22
          cache: npm
          cache-dependency-path: v3/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `vite build` does not typecheck. `npm run build` is `tsc -b && vite
      # build`, so a type error fails the deploy here rather than shipping.
      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: v3/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
