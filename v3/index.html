<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      Sampled from the composited backdrop at the viewport edge (v2's value),
      and the same as --bg-edge, the root canvas colour. Not --bg-page: since
      v3 took over v2's aurora field, the near-black page colour is never what
      any edge of the page looks like, and on iPhone Safari it painted solid
      black bands behind the status bar and the bottom toolbar.
    -->
    <meta name="theme-color" content="#0a111b" />

    <title>Daniel Zhou | Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Daniel Zhou (Magicherry) — Business Analyst Assistant & AI Agent Engineer at NIO, building enterprise agent systems for manufacturing operations."
    />
    <meta name="author" content="Daniel Zhou" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Daniel Zhou | Portfolio" />
    <meta
      property="og:description"
      content="Enterprise AI agents, full-stack engineering and data-driven decision support. Selected work, experience and contact."
    />
    <meta property="og:url" content="https://Magicherry.github.io/" />

    <!--
      Three families, each with one job: DM Sans for body copy, Montserrat for
      headings, Fragment Mono for labels and terminal lines. Chinese falls
      through to the system's own Han face (PingFang / YaHei / Noto) - a web
      CJK font is megabytes, and the system faces are what readers already know.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fragment+Mono&family=Montserrat:wght@400;500;600&display=swap"
    />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
