<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      Sampled from the composited backdrop at the viewport edge, not from
      --bg-base. The base token is the near-black *under* the aurora and is never
      what any edge of the page actually looks like; handing it to the browser
      paints the toolbars darker than the page they border, which is the black
      band phones show above and below the content.

      KEEP IN SYNC with THEME_COLOR in src/lib/theme.tsx.
    -->
    <meta name="theme-color" content="#0a1520" />

    <title>Daniel Zhou | Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Daniel Zhou (Magicherry) — AI Agent Engineer at NIO, building enterprise agent systems and obsessively detailed interfaces."
    />
    <meta name="author" content="Daniel Zhou" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Daniel Zhou | Portfolio" />
    <meta
      property="og:description"
      content="Enterprise AI agents by day, interface details by night. Selected work, experience and contact."
    />
    <meta property="og:url" content="https://Magicherry.github.io/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin />

    <script>
      /*
       * Theme, resolved before first paint.
       *
       * React cannot do this. By the time the bundle has parsed and the effect
       * has run the browser has already painted a frame, and that frame would be
       * a full-screen flash of the wrong theme. A few lines of blocking script is
       * the one trade where stalling the parser is worth it.
       *
       * It now matters on a *first* visit too, not only for a returning visitor
       * who chose light: <html> is stamped dark in the markup, so a device set to
       * light would flash dark before React resolved the media query. The stamp
       * stays dark because it is the right answer whenever this script cannot run
       * or has nothing to go on.
       *
       * Order matters. The stored choice is permanent and outranks the device, so
       * the query is only consulted when there is no live override.
       *
       * KEEP IN SYNC with getSystemTheme/THEME_COLOR in src/lib/theme.tsx.
       */
      ;(function () {
        var theme = null

        // Outside the try: matchMedia does not throw, and a storage failure must
        // not cost a light-mode device its theme. Queried as `light` so that
        // `no-preference` and engines without the feature both fall to dark.
        var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches

        try {
          var raw = localStorage.getItem('v2:theme')
          if (raw) {
            var parsed = JSON.parse(raw)
            // expiresAt === null means the choice never lapses.
            if (parsed && (parsed.expiresAt === null || Date.now() < parsed.expiresAt)) {
              theme = parsed.value
            }
          }
        } catch (e) {
          /* localStorage can throw in private modes; the device setting stands. */
        }

        if (theme !== 'dark' && theme !== 'light') {
          theme = prefersLight ? 'light' : 'dark'
        }

        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'light' ? '#eef2f8' : '#0a1520')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
