<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      Sampled from the composited backdrop at the viewport edge, not from
      --bg-base. The base token is the near-black *under* the aurora and is never
      what any edge of the page actually looks like; handing it to the browser
      paints the toolbars darker than the page they border, which is the black
      band phones show above and below the content.

      KEEP IN SYNC with THEME_COLOR in src/lib/theme.tsx.
    -->
    <meta name="theme-color" content="#0a1520" />

    <title>Daniel Zhou | Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Daniel Zhou (Magicherry) — AI Agent Engineer at NIO, building enterprise agent systems and obsessively detailed interfaces."
    />
    <meta name="author" content="Daniel Zhou" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Daniel Zhou | Portfolio" />
    <meta
      property="og:description"
      content="Enterprise AI agents by day, interface details by night. Selected work, experience and contact."
    />
    <meta property="og:url" content="https://Magicherry.github.io/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://cdn.simpleicons.org" crossorigin />

    <script>
      /*
       * Theme, applied before first paint.
       *
       * A first visit needs none of this - <html> is already stamped dark, which
       * is now the default for everyone. This exists for the returning visitor
       * who chose light: their preference lives in localStorage, and React
       * cannot read it in time. By the time the bundle has parsed and the effect
       * has run the browser has already painted a frame, and that frame would be
       * a full-screen flash of the theme they explicitly turned off. A few lines
       * of blocking script is the one trade where stalling the parser is worth
       * it.
       */
      ;(function () {
        try {
          var raw = localStorage.getItem('v2:theme')
          var theme = null
          if (raw) {
            var parsed = JSON.parse(raw)
            // expiresAt === null means the choice never lapses.
            if (parsed && (parsed.expiresAt === null || Date.now() < parsed.expiresAt)) {
              theme = parsed.value
            }
          }
          // Dark is the default for a first visit, `prefers-color-scheme`
          // included - the site is designed against a near-black ground and
          // light mode is a separate design, not an inversion. KEEP IN SYNC
          // with DEFAULT_THEME in src/lib/theme.tsx.
          if (theme !== 'dark' && theme !== 'light') {
            theme = 'dark'
          }
          document.documentElement.dataset.theme = theme
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'light' ? '#eef2f8' : '#0a1520')
        } catch (e) {
          /* localStorage can throw in private modes; the dark default stands. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
